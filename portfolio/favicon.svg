<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#051923" />
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- IC Chip Body -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" />
  
  <!-- Corner Solder Pads / Mounting Holes -->
  <circle cx="10" cy="10" r="2.5" fill="#f59e0b" stroke="#0a0f1d" stroke-width="1"/>
  <circle cx="54" cy="10" r="2.5" fill="#f59e0b" stroke="#0a0f1d" stroke-width="1"/>
  <circle cx="10" cy="54" r="2.5" fill="#f59e0b" stroke="#0a0f1d" stroke-width="1"/>
  <circle cx="54" cy="54" r="2.5" fill="#f59e0b" stroke="#0a0f1d" stroke-width="1"/>
  
  <!-- PCB Circuit Traces -->
  <path d="M10 10 L22 10 L26 14" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M54 10 L42 10 L38 14" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M10 54 L22 54 L26 50" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M54 54 L42 54 L38 50" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- Center Monogram 'SV' -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-weight="900" font-size="24" fill="url(#traceGrad)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">SV</text>
  
  <!-- Micro Dot / Chip Pin -->
  <circle cx="32" cy="18" r="1.5" fill="#06b6d4" />
</svg>
